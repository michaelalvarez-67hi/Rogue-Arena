name: Build Rogue Arena APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y localizar proyecto
        run: |
          mkdir -p work
          for z in $(find . -maxdepth 1 -name '*.zip'); do unzip -q -o "$z" -d work; done
          for z in $(find work -name '*.zip'); do unzip -q -o "$z" -d work/interno; done
          F=$(find work -name settings.gradle | head -1)
          if [ -z "$F" ]; then echo "NO SE ENCONTRO settings.gradle"; find work -type f | head -50; exit 1; fi
          echo "Proyecto en: $F"
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
          if [ -f juego.html ]; then cp juego.html "$(dirname "$F")/app/src/main/assets/index.html"; echo "Usando juego.html del repositorio"; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK de Android
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Usar llave de firma fija
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; echo "Llave fija en uso"; else echo "Sin debug.keystore: se usara una llave nueva"; fi
      - name: Compilar APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rogue-Arena-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

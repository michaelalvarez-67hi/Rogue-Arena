name: Build Rogue Arena APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir y localizar proyecto
        run: |
          echo "=== ARCHIVOS EN EL REPO ==="
          find . -not -path './.git/*' -type f | head -40
          for z in $(find . -name '*.zip' -not -path './.git/*'); do
            echo "Descomprimiendo $z"
            unzip -q -o "$z" -d extraido || true
          done
          echo "=== DESPUES DE DESCOMPRIMIR ==="
          find . -not -path './.git/*' -type f | head -60
          F=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "NO SE ENCONTRO settings.gradle"; exit 1; fi
          echo "Proyecto en: $F"
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK de Android
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rogue-Arena-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
